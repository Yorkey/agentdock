name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to upload to (e.g. v1.0.2)'
        required: true
        default: 'v1.0.0'
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - mac
          - win

permissions:
  contents: write

jobs:
  build-mac:
    if: inputs.platforms == 'all' || inputs.platforms == 'mac'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # 始终用 main 上的最新打包配置（含签名/公证）；tag 仅用于上传 Release。
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -A
          curl -fsSL -o /tmp/g2.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o /tmp/root.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/g2.cer -k build.keychain -A
          security import /tmp/root.cer -k build.keychain -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build signed & notarized app
        env:
          CSC_KEYCHAIN: build.keychain
          CSC_KEYCHAIN_PASSWORD: actions
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm dist:mac

      - name: Verify signature & notarization
        run: |
          APP="apps/desktop/release/mac-arm64/AgentDock.app"
          echo "→ codesign"
          codesign -dv --verbose=2 "$APP"
          echo "→ Gatekeeper"
          spctl -a -vv --type execute "$APP"
          echo "→ staple app (DMG 容器本身无需 staple，.app 有票据即可)"
          xcrun stapler validate "$APP"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentDock-macOS
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

      - name: Upload to GitHub Release
        if: startsWith(inputs.tag, 'v')
        run: |
          gh release upload "${{ inputs.tag }}" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    if: inputs.platforms == 'all' || inputs.platforms == 'win'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app
        # 当前未配置 Windows 代码签名证书，产物为未签名安装包。
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentDock-Windows
          path: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*.zip

      - name: Upload to GitHub Release
        if: startsWith(inputs.tag, 'v')
        shell: bash
        run: |
          gh release upload "${{ inputs.tag }}" \
            apps/desktop/release/*-setup.exe \
            apps/desktop/release/*.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
