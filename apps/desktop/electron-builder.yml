appId: app.agentdock.desktop
productName: AgentDock
copyright: Copyright © 2026 AgentDock
artifactName: AgentDock-${version}-${os}-${arch}.${ext}

directories:
  output: release

# 主进程 / preload / renderer / worker 都由 electron-vite 打进 out/。
# cordis 与 workspace 包已 bundle，不要再拷贝 pnpm node_modules。
files:
  - package.json
  - out/**/*
  - '!node_modules/**'
  - '!src/**'
  - '!scripts/**'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'

asar: true
# hashed scan worker + out/main/package.json（type:module）必须在磁盘上，
# 否则 utilityProcess.fork 无法从 asar 里加载 ESM worker。
asarUnpack:
  - out/main/index-*.js
  - out/main/package.json

npmRebuild: false
nodeGypRebuild: false

electronLanguages:
  - en
  - zh_CN

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  target:
    - dmg
    - zip

dmg:
  artifactName: AgentDock-${version}-mac-${arch}.${ext}
  sign: true

win:
  executableName: AgentDock
  icon: build/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  artifactName: AgentDock-${version}-win-${arch}-setup.${ext}
